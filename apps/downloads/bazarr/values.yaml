namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/bazarr"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  bazarr:
    image:
      repository: ghcr.io/home-operations/bazarr
      tag: "1.5.6"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 6767
      targetPort: 6767
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: bazarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 5Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: shows
          mountPath: /tv
          server: "100.64.100.10"
          path: "/storage/media/shows"
          readOnly: false
        - name: movies
          mountPath: /movies
          server: "100.64.100.10"
          path: "/storage/media/movies"
          readOnly: false

      emptyDir:
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: POSTGRES_ENABLED
        value: "True"
      - name: POSTGRES_HOST
        value: "postgres-rw.database.svc.cluster.local"
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_DATABASE
        value: "bazarr"
      - name: POSTGRES_USERNAME
        valueFrom:
          secretKeyRef:
            name: bazarr
            key: username
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: bazarr
            key: password

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
