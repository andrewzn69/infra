namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/bazarr"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  bazarr:
    image:
      repository: ghcr.io/home-operations/bazarr
      tag: "1.5.6"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 6767
      targetPort: 6767
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: bazarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 1Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/backup: enabled

      nfs:
        - name: shows
          mountPath: /tv
          server: "192.168.1.50"
          path: "/storage/media/shows"
          readOnly: false
        - name: movies
          mountPath: /movies
          server: "192.168.1.50"
          path: "/storage/media/movies"
          readOnly: false

      emptyDir:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /config/log

    resources:
      requests:
        memory: 448Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 300m

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: POSTGRES_ENABLED
        value: "True"
      - name: POSTGRES_HOST
        value: "postgres-rw.database.svc.cluster.local"
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_DATABASE
        value: "bazarr"
      - name: POSTGRES_USERNAME
        valueFrom:
          secretKeyRef:
            name: bazarr
            key: username
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: bazarr
            key: password

    replicaCount: 0

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false

  exportarr:
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: "v2.3.0"
      pullPolicy: IfNotPresent

    args:
      - bazarr

    service:
      type: ClusterIP
      port: 9707
      targetPort: 9707
      protocol: TCP
      name: http

    gateway:
      enabled: false

    commonAnnotations:
      prometheus.io/scrape: "true"

    resources:
      requests:
        memory: 32Mi
        cpu: 5m
      limits:
        memory: 128Mi

    env:
      - name: PORT
        value: "9707"
      - name: URL
        value: "http://bazarr.downloads.svc.cluster.local:6767"
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: bazarr
            key: API_KEY

    replicaCount: 1

    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9707
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      readiness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9707
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      startup:
        enabled: false

    metrics:
      enabled: false
