namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/lidarr"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  lidarr:
    image:
      repository: ghcr.io/home-operations/lidarr
      tag: "3.1.2"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8686
      targetPort: 8686
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: lidarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 5Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: music
          mountPath: /music
          server: "100.64.100.10"
          path: "/storage/media/music"
          readOnly: false
        - name: downloads
          mountPath: /downloads
          server: "100.64.100.10"
          path: "/storage/downloads"
          readOnly: false

      emptyDir:
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 128Mi
        cpu: 200m
      limits:
        memory: 256Mi
        cpu: 500m

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: LIDARR__POSTGRES__HOST
        value: "postgres-rw.database.svc.cluster.local"
      - name: LIDARR__POSTGRES__PORT
        value: "5432"
      - name: LIDARR__POSTGRES__MAINDB
        value: "lidarr"
      - name: LIDARR__POSTGRES__USER
        valueFrom:
          secretKeyRef:
            name: lidarr
            key: username
      - name: LIDARR__POSTGRES__PASSWORD
        valueFrom:
          secretKeyRef:
            name: lidarr
            key: password
      - name: LIDARR__LOG__DBENABLED
        value: "False"

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
