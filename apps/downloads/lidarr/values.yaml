namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/lidarr"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  lidarr:
    image:
      repository: ghcr.io/home-operations/lidarr
      tag: "3.1.2"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8686
      targetPort: 8686
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: lidarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 2Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/backup: enabled

      nfs:
        - name: music
          mountPath: /music
          server: "192.168.1.50"
          path: "/storage/media/music"
          readOnly: false
        - name: downloads
          mountPath: /downloads
          server: "192.168.1.50"
          path: "/storage/downloads/slskd"
          readOnly: false

      emptyDir:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /config/logs

    resources:
      requests:
        memory: 384Mi
        cpu: 20m
      limits:
        memory: 2Gi

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: LIDARR__POSTGRES__HOST
        value: "postgres-rw.database.svc.cluster.local"
      - name: LIDARR__POSTGRES__PORT
        value: "5432"
      - name: LIDARR__POSTGRES__MAINDB
        value: "lidarr"
      - name: LIDARR__POSTGRES__USER
        valueFrom:
          secretKeyRef:
            name: lidarr
            key: username
      - name: LIDARR__POSTGRES__PASSWORD
        valueFrom:
          secretKeyRef:
            name: lidarr
            key: password
      - name: LIDARR__LOG__DBENABLED
        value: "False"

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false

  exportarr:
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: "v2.3.0"
      pullPolicy: IfNotPresent

    args:
      - lidarr

    service:
      type: ClusterIP
      port: 9707
      targetPort: 9707
      protocol: TCP
      name: http

    gateway:
      enabled: false

    commonAnnotations:
      prometheus.io/scrape: "true"

    resources:
      requests:
        memory: 32Mi
        cpu: 5m
      limits:
        memory: 128Mi

    env:
      - name: PORT
        value: "9707"
      - name: URL
        value: "http://lidarr.downloads.svc.cluster.local:8686"
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: lidarr
            key: API_KEY

    replicaCount: 1

    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9707
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      readiness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9707
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      startup:
        enabled: false

    metrics:
      enabled: false
