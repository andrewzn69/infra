namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/prowlarr"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  prowlarr:
    image:
      repository: ghcr.io/home-operations/prowlarr
      tag: "2.3.7"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 9696
      targetPort: 9696
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: prowlarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 2Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      emptyDir:
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 128Mi
        cpu: 18m
      limits:
        memory: 512Mi

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: PROWLARR__POSTGRES__HOST
        value: "postgres-rw.database.svc.cluster.local"
      - name: PROWLARR__POSTGRES__PORT
        value: "5432"
      - name: PROWLARR__POSTGRES__MAINDB
        value: "prowlarr"
      - name: PROWLARR__POSTGRES__USER
        valueFrom:
          secretKeyRef:
            name: prowlarr
            key: username
      - name: PROWLARR__POSTGRES__PASSWORD
        valueFrom:
          secretKeyRef:
            name: prowlarr
            key: password
      - name: PROWLARR__LOG__DBENABLED
        value: "False"

    replicaCount: 0

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false

  exportarr:
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: "v2.3.0"
      pullPolicy: IfNotPresent

    args:
      - prowlarr

    service:
      type: ClusterIP
      port: 9707
      targetPort: 9707
      protocol: TCP
      name: http

    gateway:
      enabled: false

    commonAnnotations:
      prometheus.io/scrape: "true"

    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi

    env:
      - name: PORT
        value: "9707"
      - name: URL
        value: "http://prowlarr.downloads.svc.cluster.local:9696"
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: prowlarr
            key: API_KEY

    replicaCount: 1

    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9707
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      readiness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9707
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      startup:
        enabled: false

    metrics:
      enabled: false
