namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/prowlarr"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  prowlarr:
    image:
      repository: ghcr.io/home-operations/prowlarr
      tag: "2.3.7"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 9696
      targetPort: 9696
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: prowlarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 5Gi
          accessMode: ReadWriteMany
          storageClassName: longhorn

      emptyDir:
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 128Mi
        cpu: 18m
      limits:
        memory: 512Mi

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: PROWLARR__POSTGRES__HOST
        value: "postgres-rw.database.svc.cluster.local"
      - name: PROWLARR__POSTGRES__PORT
        value: "5432"
      - name: PROWLARR__POSTGRES__MAINDB
        value: "prowlarr"
      - name: PROWLARR__POSTGRES__USER
        valueFrom:
          secretKeyRef:
            name: prowlarr
            key: username
      - name: PROWLARR__POSTGRES__PASSWORD
        valueFrom:
          secretKeyRef:
            name: prowlarr
            key: password
      - name: PROWLARR__LOG__DBENABLED
        value: "False"

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
