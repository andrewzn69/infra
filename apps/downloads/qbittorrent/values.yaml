namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/qbittorrent"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  qbittorrent:
    image:
      repository: ghcr.io/home-operations/qbittorrent
      tag: "5.1.4@sha256:bb82ad6668f8eda1d0fcce6c1341498bfa879155bb1295cd9d314a2c35c07a01"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: qbittorrent.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 1Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/backup: enabled
      nfs:
        - name: downloads
          mountPath: /downloads
          server: "192.168.1.50"
          path: "/storage/downloads/qbittorrent"
          readOnly: false

    resources:
      requests:
        cpu: 200m
        memory: 1280Mi
      limits:
        memory: 6Gi

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: WEBUI_PORT
        value: "8080"

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false

    sidecars:
      custom:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_ADDRESSES
            - name: FIREWALL_INPUT_PORTS
              value: "8080" # lets the cluster reach qbittorrent web ui
            # allow qbittorrent to reach cluster-internal services (pods + services) through the vpn firewall
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.244.0.0/16,10.96.0.0/12"
            # kernelspace uses wgctrl/netlink directly - no wireguard-go, no gso/sendmmsg issues
            # does not need src_valid_mark sysctl (only wg-quick needs it, not wgctrl)
            - name: WIREGUARD_IMPLEMENTATION
              value: kernelspace
            # kernel module handles segmentation correctly, higher mtu is safe
            - name: WIREGUARD_MTU
              value: "1320"
            # only route ipv4 through the tunnel - pods have no ipv6, ::/0 route causes setup failure
            - name: WIREGUARD_ALLOWED_IPS
              value: "0.0.0.0/0"
            # pin ipv4 endpoint - pods have no ipv6, gluetun would otherwise pick ipv6 mullvad servers and fail
            - name: WIREGUARD_ENDPOINT_IP
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_ENDPOINT_IP
            - name: WIREGUARD_ENDPOINT_PORT
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_ENDPOINT_PORT

  peers-exporter:
    image:
      repository: ghcr.io/andrewzn69/qbittorrent-peers-exporter
      tag: "0.1.0@sha256:96c505ac2829b10ad9e813c6644f19ef81629d79d1682838f950b20d7e7d166f"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 9714
      targetPort: 9714
      protocol: TCP
      name: http

    gateway:
      enabled: false

    commonAnnotations:
      prometheus.io/scrape: "true"

    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi

    env:
      - name: QBIT_URL
        value: "http://qbittorrent.downloads.svc.cluster.local:8080"
      - name: QBIT_USERNAME
        valueFrom:
          secretKeyRef:
            name: qbittorrent
            key: QBIT_USERNAME
      - name: QBIT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: qbittorrent
            key: QBIT_PASSWORD

    replicaCount: 1

    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9714
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      readiness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 9714
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      startup:
        enabled: false

    metrics:
      enabled: false

  exporter:
    image:
      repository: ghcr.io/martabal/qbittorrent-exporter
      tag: "v2.0.3@sha256:bc4fa09481634ee894ebfb4d47c8aa239a32a12567b043afa01fa42a3075d1a5"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8090
      targetPort: 8090
      protocol: TCP
      name: http

    gateway:
      enabled: false

    commonAnnotations:
      prometheus.io/scrape: "true"

    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi

    env:
      - name: QBITTORRENT_BASE_URL
        value: "http://qbittorrent.downloads.svc.cluster.local:8080"
      - name: QBITTORRENT_USERNAME
        valueFrom:
          secretKeyRef:
            name: qbittorrent
            key: QBIT_USERNAME
      - name: QBITTORRENT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: qbittorrent
            key: QBIT_PASSWORD
      - name: EXPORTER_PORT
        value: "8090"

    replicaCount: 1

    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 8090
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      readiness:
        enabled: true
        type: httpGet
        httpGet:
          path: /healthz
          port: 8090
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
      startup:
        enabled: false

    metrics:
      enabled: false
