namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/qbittorrent"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  qbittorrent:
    image:
      repository: ghcr.io/home-operations/qbittorrent
      tag: "5.1.4"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: qbittorrent.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
      nfs:
        - name: downloads
          mountPath: /downloads
          server: "100.64.100.10"
          path: "/storage/downloads/qbittorrent"
          readOnly: false
      hostPath:
        # gluetun userspace wireguard needs /dev/net/tun to create the tunnel interface.
        # kernelspace wireguard requires net.ipv4.conf.all.src_valid_mark=1 sysctl (node-wide, unsafe).
        # namespace is labeled privileged to allow NET_ADMIN for gluetun.
        - name: dev-net-tun
          mountPath: /dev/net/tun
          path: /dev/net/tun
          type: CharDevice

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 6Gi

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: WEBUI_PORT
        value: "8080"

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false

    sidecars:
      custom:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.1
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_ADDRESSES
            - name: FIREWALL_INPUT_PORTS
              value: "8080" # lets the cluster reach qbittorrent web ui
            # allow qbittorrent to reach cluster-internal services (pods + services) through the vpn firewall
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.244.0.0/16,10.96.0.0/12"
            # userspace avoids the src_valid_mark sysctl required by kernelspace wireguard
            - name: WIREGUARD_IMPLEMENTATION
              value: userspace
            # pod network MTU is reduced by cilium encapsulation - cap inner tunnel MTU to avoid sendmmsg: message too long
            - name: WIREGUARD_MTU
              value: "1220"
            # only route ipv4 through the tunnel - pods have no ipv6, ::/0 route causes setup failure
            - name: WIREGUARD_ALLOWED_IPS
              value: "0.0.0.0/0"
            # pin ipv4 endpoint - pods have no ipv6, gluetun would otherwise pick ipv6 mullvad servers and fail
            - name: WIREGUARD_ENDPOINT_IP
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_ENDPOINT_IP
            - name: WIREGUARD_ENDPOINT_PORT
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: WIREGUARD_ENDPOINT_PORT
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
