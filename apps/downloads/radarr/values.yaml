namespace: downloads

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: vizima
    envSlug: prod
    secretsPath: "/downloads/radarr"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  radarr:
    image:
      repository: ghcr.io/home-operations/radarr
      tag: "6.2"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 7878
      targetPort: 7878
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: radarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 5Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: movies
          mountPath: /movies
          server: "100.64.100.10"
          path: "/storage/media/movies"
          readOnly: false
        - name: downloads
          mountPath: /downloads
          server: "100.64.100.10"
          path: "/storage/downloads/qbittorrent"
          readOnly: false

      emptyDir:
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 384Mi
        cpu: 20m
      limits:
        memory: 2Gi

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: RADARR__POSTGRES__HOST
        value: "postgres-rw.database.svc.cluster.local"
      - name: RADARR__POSTGRES__PORT
        value: "5432"
      - name: RADARR__POSTGRES__MAINDB
        value: "radarr"
      - name: RADARR__POSTGRES__USER
        valueFrom:
          secretKeyRef:
            name: radarr
            key: username
      - name: RADARR__POSTGRES__PASSWORD
        valueFrom:
          secretKeyRef:
            name: radarr
            key: password
      - name: RADARR__LOG__DBENABLED
        value: "False"

    replicaCount: 1

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
