namespace: downloads

components:
  slskd:
    image:
      repository: docker.io/slskd/slskd
      tag: "0.25.1@sha256:ab9ed50e028b524cefdb7c1dd8ebca368a076e18441ee8ac2326473eb850b4c3"
      pullPolicy: IfNotPresent

    replicaCount: 0

    service:
      type: ClusterIP
      port: 5030
      targetPort: 5030
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: slskd.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    env:
      - name: SLSKD_REMOTE_CONFIGURATION
        value: "true"

    volumes:
      pvc:
        - name: data
          mountPath: /app
          size: 1Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/backup: enabled

      nfs:
        - name: downloads
          mountPath: /downloads
          server: "192.168.1.50"
          path: "/storage/downloads/slskd"
          readOnly: false

      emptyDir:
        - name: dotnet
          mountPath: /.net
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 200m

    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
