namespace: downloads

components:
  slskd:
    image:
      repository: docker.io/slskd/slskd
      tag: "0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 5030
      targetPort: 5030
      protocol: TCP
      name: http

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: slskd.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    volumes:
      pvc:
        - name: data
          mountPath: /app
          size: 1Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/backup: enabled

      nfs:
        - name: downloads
          mountPath: /downloads
          server: "192.168.1.50"
          path: "/storage/downloads/slskd"
          readOnly: false

      emptyDir:
        - name: dotnet
          mountPath: /.net
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 200m

    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    env:
      - name: SLSKD_REMOTE_CONFIGURATION
        value: "true"

    replicaCount: 0

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false
