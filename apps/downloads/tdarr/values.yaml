namespace: downloads

components:
  tdarr:
    image:
      repository: ghcr.io/haveagitgat/tdarr
      tag: "2.94.03@sha256:aaf8ef97c035c0456ef38f869ecad2cd26c685adacf24c58a0a5100644e13f69"
      pullPolicy: IfNotPresent

    replicaCount: 1

    service:
      type: ClusterIP
      port: 8265
      targetPort: 8265
      protocol: TCP
      name: http
      additionalPorts:
        - name: server
          port: 8266
          targetPort: 8266
        - name: node
          port: 8267
          targetPort: 8267

    gateway:
      enabled: true
      gatewayName: internal
      gatewayNamespace: gateway-system
      hostname: tdarr.internal.zemn.xyz
      paths:
        - path: /
          pathType: PathPrefix

    env:
      - name: TZ
        value: "Europe/Prague"
      # s6 starts as root and then switches to this user and group
      # they match the owner of the media files
      - name: PUID
        value: "1000"
      - name: PGID
        value: "1000"
      - name: serverIP
        value: "0.0.0.0"
      - name: serverPort
        value: "8266"
      - name: webUIPort
        value: "8265"
      # the node runs inside the server container instead of a separate deployment
      - name: internalNode
        value: "true"
      - name: nodeName
        value: "vizima"

    volumes:
      pvc:
        # the database, plugins and scan results can be rebuilt, so this volume has no backup labels
        - name: server
          mountPath: /app/server
          size: 5Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: configs
          mountPath: /app/configs
          size: 1Gi
          readOnly: false
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: movies
          mountPath: /movies
          server: "192.168.1.50"
          path: "/storage/media/movies"
          readOnly: false
        - name: shows
          mountPath: /shows
          server: "192.168.1.50"
          path: "/storage/media/shows"
        - name: temp
          mountPath: /temp
          server: "192.168.1.50"
          path: "/storage/media/.tdarr_temp"
          readOnly: false

      emptyDir:
        - name: logs
          mountPath: /app/logs

    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi

    # the entrypoint changes the owner of the app and temp dirs as root
    # it then switches to the configured user and group
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    # s6 runs as pid 1 under root
    # it creates the user from PUID, fixes file ownership and then switches to that user
    # running as non-root, a read only rootfs or removing capabilities would each break this
    securityContext:
      allowPrivilegeEscalation: false

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false

    metrics:
      enabled: false

  tdarr-exporter:
    image:
      repository: homeylab/tdarr-exporter
      tag: "3.1.0@sha256:c72fd0ecf4aa5207d4f609d09fbb6470bac9e4dc5d9524303cd7169f5751bf62"
      pullPolicy: IfNotPresent

    replicaCount: 1

    service:
      type: ClusterIP
      port: 9090
      targetPort: 9090
      protocol: TCP
      name: http

    gateway:
      enabled: false

    # the annotated-pods scrape job only rewrites the target address when the port annotation is set
    commonAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"

    env:
      - name: TDARR_URL
        value: "http://tdarr.downloads.svc.cluster.local:8265"

    resources:
      requests:
        memory: 32Mi
        cpu: 5m
      limits:
        memory: 128Mi

    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    configMap:
      enabled: false

    initContainers:
      fixPermissions:
        enabled: false

    probes:
      liveness:
        enabled: true
        type: tcpSocket
        tcpSocket:
          port: 9090
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 5
