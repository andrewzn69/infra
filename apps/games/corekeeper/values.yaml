namespace: games

secrets:
  enabled: true
  type: infisical
  infisical:
    hostAPI: https://eu.infisical.com
    projectSlug: novigrad
    envSlug: prod
    secretsPath: "/games/corekeeper"
    auth:
      credentialsSecretName: infisical-universal-auth
      credentialsSecretNamespace: infisical-system
    managedSecret:
      creationPolicy: Owner

components:
  corekeeper:
    image:
      repository: docker.io/escaping/core-keeper-dedicated
      tag: "v2.8.1@sha256:87fa7925596264e1460cb6c7c128e9d39ac5445206e04e587993b5d4afa7c90f"
      pullPolicy: IfNotPresent

    replicaCount: 1

    # playit tunnels to 127.0.0.1, nothing reaches this pod from the cluster
    service:
      enabled: false

    env:
      # box64 build variant for oci
      - name: ARM64_DEVICE
        value: "adlink"
      # steamcmd self updates to a linuxarm64 binary that does not exist
      - name: USE_DEPOT_DOWNLOADER
        value: "true"
      - name: WORLD_NAME
        value: "pohankajenegr"
      - name: MAX_PLAYERS
        value: "8"
      - name: SERVER_IP
        value: "0.0.0.0"
      # setting a port switches the server from steam relay to direct connect
      - name: SERVER_PORT
        value: "27015"
      - name: PASSWORD
        valueFrom:
          secretKeyRef:
            name: corekeeper
            key: PASSWORD

    volumes:
      pvc:
        - name: data
          mountPath: /home/steam/core-keeper-data
          size: 2Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        # steamcmd game install, kept to avoid redownloading on restart
        - name: files
          mountPath: /home/steam/core-keeper-dedicated
          size: 8Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn

    resources:
      requests:
        memory: 2Gi
        cpu: 600m
      limits:
        memory: 3Gi
        cpu: 600m

    podSecurityContext:
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    # entrypoint chowns the data dirs then drops to steam, so it needs root
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID

    sidecars:
      custom:
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:1.0@sha256:5b7748d3e8564f1cac3d3a295a23640136fbf774c76a9509bd262d16b324b06b

          # default socket is /run/playit, a dir the image never creates
          args:
            - --socket-path
            - /tmp/playitd.sock

          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: corekeeper
                  key: PLAYIT_SECRET_KEY
            - name: PLAYIT_LOG
              value: "debug"

          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
