global:
  domain: argocd.internal.zemn.xyz

configs:
  params:
    server.insecure: "true"
    server.url: "https://argocd.internal.zemn.xyz"

server:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  service:
    # gw talks http2 to this port so grpc works
    servicePortHttpsAppProtocol: kubernetes.io/h2c
  httproute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: internal
        namespace: gateway-system
        sectionName: https
    hostnames:
      - argocd.internal.zemn.xyz
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

repoServer:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 1Gi

applicationSet:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m

dex:
  enabled: false
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

redis:
  resources:
    requests:
      memory: 32Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m

notifications:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

controller:
  resources:
    requests:
      memory: 512Mi
      cpu: 150m
    limits:
      cpu: 500m

# own grpcroute since the chart one targets port 80 when insecure
extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GRPCRoute
    metadata:
      name: argocd-server-grpc
      namespace: argocd
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal
          namespace: gateway-system
          sectionName: https
      hostnames:
        - argocd-grpc.internal.zemn.xyz
      rules:
        - backendRefs:
            - group: ""
              kind: Service
              name: argocd-server
              port: 443
              weight: 1
