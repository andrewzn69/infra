apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium
  namespace: argocd
spec:
  generators:
    - clusters: {}
  template:
    metadata:
      name: cilium-{{name}}
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://github.com/andrewzn69/infra
          targetRevision: HEAD
          ref: infra
        - repoURL: https://helm.cilium.io/
          chart: cilium
          targetRevision: 1.19.4
          helm:
            releaseName: cilium
            valueFiles:
              - $infra/apps/infrastructure/cilium/values.{{name}}.yaml
      destination:
        server: "{{server}}"
        namespace: kube-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
