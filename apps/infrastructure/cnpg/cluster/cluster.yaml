---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
  annotations:
    # 2026-09-06: argocd pruned cluster and cnpg rebuilt it empty.
    # the cnpg-cluster Application stopped rendering its own application.yaml,
    # so with prune:true it pruned itself, and its resources-finalizer cascade
    # deleted everything it owned, including this cluster and its pvcs.
    # every db was lost and restored from daily volumesnapshot.
    #
    # Prune=false - never delete when it disappears from git
    # Delete=false - never delete when the Application is deleted (cascade)
    #
    # deleting this cluster must be a deliberate manual step, never a side effect
    # of some argocd sync.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 3
  storage:
    size: 30Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi

  backup:
    volumeSnapshot:
      className: longhorn-backup-vsc
      # no wal archive exists, a hot backup would block waiting
      # for the archiver to ship the last segment
      online: false
      # deleting a backup deletes the snapshot, which deletes the nas copy
      snapshotOwnerReference: backup

  managed:
    roles:
      - name: bazarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-bazarr
      - name: invidious
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-invidious
      - name: lidarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-lidarr
      - name: materialious
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-materialious
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-prowlarr
      - name: radarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-radarr
      - name: sonarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-sonarr
      - name: grafana
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-grafana
