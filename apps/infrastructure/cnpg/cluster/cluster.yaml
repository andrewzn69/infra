apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  instances: 3
  storage:
    size: 5Gi
    storageClass: longhorn-cnpg
  managed:
    roles:
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-prowlarr
