---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
  annotations:
    # on 2026-09-06 argocd deleted this cluster and its pvcs
    # the cnpg-cluster Application had stopped rendering its own application.yaml
    # pruning was on, so argocd pruned the Application itself
    # because of its finalizer, argocd then deleted everything that the Application owned
    # cnpg recreated the cluster empty
    # every db had to be restored from a volume snapshot
    #
    # with Prune off, argocd keeps the cluster when it's removed from git
    # with Delete off, argocd keeps the cluster when the Application is deleted
    #
    # deleting this cluster has to be a manual step, never a side effect of an argocd sync
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 2
  primaryUpdateMethod: switchover
  storage:
    size: 30Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi

  backup:
    volumeSnapshot:
      className: longhorn-backup-vsc
      # there's no wal archive
      # an online backup would hang while it waits for the last wal segment to be archived
      online: false
      # deleting a backup also deletes its snapshot and the copy on the nas
      snapshotOwnerReference: backup

  managed:
    roles:
      - name: bazarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-bazarr
      - name: invidious
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-invidious
      - name: lidarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-lidarr
      - name: materialious
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-materialious
      - name: prowlarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-prowlarr
      - name: radarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-radarr
      - name: sonarr
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-sonarr
      - name: grafana
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-grafana
      - name: kaneo
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-kaneo
      - name: nextcloud
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-nextcloud
