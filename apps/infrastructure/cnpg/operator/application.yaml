apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: git@github.com:andrewzn69/infra.git
      targetRevision: HEAD
      ref: infra
    - repoURL: oci://ghcr.io/cloudnative-pg/charts
      chart: cloudnative-pg
      targetRevision: 0.28.3
      helm:
        releaseName: cnpg-operator
        valueFiles:
          - $infra/apps/infrastructure/cnpg/operator/values.yaml
  destination:
    name: vizima
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
