csi:
  allowControllerSecretAccess: false
defaultBackupStore:
  backupTarget: nfs://100.64.100.10:/storage/backup/longhorn/vizima
defaultSettings:
  defaultDataPath: /var/mnt/data/longhorn
  guaranteedInstanceManagerCpu: "12"
  concurrentReplicaRebuildPerNodeLimit: "2"
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  engineImagePodLivenessProbeTimeout: "30"
  engineImagePodLivenessProbePeriod: "60"
  # when an app is scaled down, its volume is detached
  # recurring jobs skip detached volumes unless this is on
  allowRecurringJobWhileVolumeDetached: true
  # without requests the csi plugin runs as BestEffort
  # on a busy node it doesn't get enough cpu and fails its liveness probe
  systemManagedCSIComponentsResourceLimits: '{"longhorn-csi-plugin":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"128Mi"}},"longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"64Mi"}}}'
extraObjects:
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: backup-daily
      namespace: longhorn-system
    spec:
      cron: "0 3 * * *"
      task: backup
      retain: 7
      concurrency: 1
      groups:
        - backup
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: backup-weekly
      namespace: longhorn-system
    spec:
      cron: "0 4 * * 0"
      task: backup
      retain: 4
      concurrency: 1
      groups:
        - backup
  # saves the pvc, pv and volume objects
  # a rebuilt cluster can then reuse the existing data instead of creating empty volumes
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: system-backup
      namespace: longhorn-system
    spec:
      cron: "0 12 * * *"
      task: system-backup
      # keeps the same number of backups as the daily backup job
      retain: 7
      concurrency: 1
      parameters:
        volume-backup-policy: disabled

httproute:
  enabled: true
  parentRefs:
    - name: internal
      namespace: gateway-system
      sectionName: https
  hostnames:
    - longhorn.internal.zemn.xyz

longhornManager:
  # without requests the manager runs as BestEffort
  # on a busy node it doesn't get enough cpu
  # its readiness probe times out, and longhorn then marks the node as down
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
networkPolicies:
  restrictInternalTraffic: false
persistence:
  defaultClassReplicaCount: 2
preUpgradeChecker:
  jobEnabled: false
