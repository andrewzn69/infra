---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: vizima-gateway
  namespace: tailscale-system
  annotations:
    tailscale.com/tailnet-ip: "100.64.100.20"
spec:
  type: ExternalName
  # kubernetes requires this field
  # the tailscale operator replaces the value with the proxy pod's hostname
  externalName: placeholder
  ports:
    - port: 443
      protocol: TCP
      name: https
