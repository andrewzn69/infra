apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-egress-vizima
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:andrewzn69/infra.git
    targetRevision: HEAD
    path: apps/infrastructure/tailscale/egress/vizima
    directory:
      exclude: "application.yaml"
  destination:
    name: vizima
    namespace: tailscale-system
  # tailscale operator overwrites spec.externalName on the egress service with the
  # proxy pods in-cluster hostname, without this, selfHeal resets it to "placeholder"
  # and breaks the egress route
  ignoreDifferences:
    - group: ""
      kind: Service
      name: novigrad-oke-api
      jsonPointers:
        - /spec/externalName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
