apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-egress-vizima
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:andrewzn69/infra.git
    targetRevision: HEAD
    path: apps/infrastructure/tailscale/egress/vizima
    directory:
      exclude: "application.yaml"
  destination:
    name: vizima
    namespace: tailscale-system
  # the tailscale operator sets spec.externalName on the egress service to the proxy pod's hostname in the cluster
  # without this, selfHeal would reset it to the placeholder value from git
  # that would break the egress route
  ignoreDifferences:
    - group: ""
      kind: Service
      name: novigrad-oke-api
      jsonPointers:
        - /spec/externalName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
