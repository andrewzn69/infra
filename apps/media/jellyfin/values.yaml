namespace: media

components:
  jellyfin:
    image:
      repository: docker.io/jellyfin/jellyfin
      tag: "12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771"
      pullPolicy: IfNotPresent

    replicaCount: 1

    service:
      type: ClusterIP
      port: 8096
      targetPort: 8096
      protocol: TCP
      name: http

    cloudflare:
      enabled: true
      hostname: jellyfin.zemn.xyz
      paths:
        - path: /
          pathType: Prefix

    # jellyfin plugins can only reach radarr and sonarr on vizima through the egress proxy
    hostAliases:
      - ip: 10.112.67.67
        hostnames:
          - radarr.internal.zemn.xyz
          - sonarr.internal.zemn.xyz

    env:
      - name: JELLYFIN_DATA_DIR
        value: "/data"
      - name: JELLYFIN_CONFIG_DIR
        value: "/config"
      - name: JELLYFIN_LOG_DIR
        value: "/log"

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 100Mi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: data
          mountPath: /data
          size: 8Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: metadata
          mountPath: /metadata
          size: 6Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: log
          mountPath: /log
          size: 100Mi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: transcodes
          mountPath: /transcodes
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: cache
          mountPath: /cache
          size: 1Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: movies
          mountPath: /media/Movies
          server: "100.64.100.10"
          path: "/storage/media/movies"
          readOnly: true
        - name: shows
          mountPath: /media/Shows
          server: "100.64.100.10"
          path: "/storage/media/shows"
          readOnly: true

      emptyDir:
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 3Gi
        cpu: 3000m

    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
