namespace: media

components:
  jellyfin:
    image:
      repository: docker.io/jellyfin/jellyfin
      tag: "12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771"
      pullPolicy: IfNotPresent

    # TODO: remove after files are copied to the new volumes
    command:
      - sleep
      - infinity

    replicaCount: 1

    service:
      type: ClusterIP
      port: 8096
      targetPort: 8096
      protocol: TCP
      name: http

    cloudflare:
      enabled: true
      hostname: jellyfin.zemn.xyz
      paths:
        - path: /
          pathType: Prefix

    # jellyfin plugins can only reach radarr and sonarr on vizima through the egress proxy
    hostAliases:
      - ip: 10.112.67.67
        hostnames:
          - radarr.internal.zemn.xyz
          - sonarr.internal.zemn.xyz

    env: []

    # TODO: remove once jellyfin runs on the new volumes
    initContainers:
      custom:
        - name: rewrite-db-paths
          image: docker.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          env:
            # builds one update per column of every table for each old path
            - name: REWRITE_QUERIES
              value: |
                WITH moves(old_path, new_path) AS (
                  VALUES
                    ('/config/metadata', '/metadata'),
                    ('/config/root', '/data/root'),
                    ('/config/config/', '/config/')
                )
                SELECT format(
                  'UPDATE "%w" SET "%w" = replace("%w", %Q, %Q) WHERE typeof("%w") = ''text'' AND instr("%w", %Q);'
                  || ' SELECT %Q, %Q, %Q, changes() WHERE changes() > 0;',
                  m.name, p.name, p.name, old_path, new_path, p.name, p.name, old_path,
                  m.name, p.name, old_path)
                FROM sqlite_master m
                JOIN pragma_table_info(m.name) p
                CROSS JOIN moves
                WHERE m.type = 'table';
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              # the root fs is read only, so apk installs sqlite into the emptyDir
              mkdir -p /tmp/apk/etc/apk
              cp -r /etc/apk/keys /tmp/apk/etc/apk/
              apk add --root /tmp/apk --initdb --usermode --no-scripts --repositories-file /etc/apk/repositories sqlite
              export LD_LIBRARY_PATH=/tmp/apk/usr/lib:/tmp/apk/lib
              sqlite=/tmp/apk/usr/bin/sqlite3
              db=/data/data/jellyfin.db
              "$sqlite" "$db" "$REWRITE_QUERIES" > /tmp/apk/updates.sql
              echo 'table|column|old path|rows changed'
              { echo 'BEGIN;'; cat /tmp/apk/updates.sql; echo 'COMMIT;'; } | "$sqlite" -bail "$db"
              # jellyfin gets the same emptyDir as its /tmp
              rm -rf /tmp/apk
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

    volumes:
      pvc:
        - name: config
          mountPath: /config
          size: 15Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: data
          mountPath: /data
          size: 8Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: metadata
          mountPath: /metadata
          size: 6Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: log
          mountPath: /log
          size: 100Mi
          accessMode: ReadWriteOnce
          storageClassName: longhorn
        - name: backup
          mountPath: /backup
          size: 100Mi
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      nfs:
        - name: movies
          mountPath: /media/Movies
          server: "100.64.100.10"
          path: "/storage/media/movies"
          readOnly: true
        - name: shows
          mountPath: /media/Shows
          server: "100.64.100.10"
          path: "/storage/media/shows"
          readOnly: true

      emptyDir:
        - name: cache
          mountPath: /cache
        - name: tmp
          mountPath: /tmp

    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 3Gi
        cpu: 3000m

    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
