namespace: media

components:
  seerr:
    image:
      repository: ghcr.io/seerr-team/seerr
      tag: "v3.4.1"
      pullPolicy: IfNotPresent

    replicaCount: 1

    service:
      type: ClusterIP
      port: 5055
      targetPort: 5055
      protocol: TCP
      name: http

    volumes:
      pvc:
        - name: config
          mountPath: /app/config
          size: 2Gi
          accessMode: ReadWriteOnce
          storageClassName: longhorn

      emptyDir:
        - name: tmp
          mountPath: /tmp

    # radarr and sonarr run on vizima, reachable only through egress proxy
    hostAliases:
      - ip: 10.112.67.67
        hostnames:
          - radarr.internal.zemn.xyz
          - sonarr.internal.zemn.xyz

    resources:
      requests:
        memory: 256Mi
        cpu: 50m
      limits:
        memory: 1Gi

    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    env:
      - name: TZ
        value: "Europe/Prague"
      - name: LOG_LEVEL
        value: "info"
      # TODO: change to postgres after deploying cnpg on novigrad
      - name: DB_TYPE
        value: "sqlite"
