apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: git@github.com:andrewzn69/infra.git
      targetRevision: HEAD
      ref: infra
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 12.11.2
      helm:
        releaseName: grafana
        valueFiles:
          - $infra/apps/observability/grafana/values.yaml
  destination:
    name: vizima
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
