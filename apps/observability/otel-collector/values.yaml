mode: daemonset

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
command:
  name: otelcol-k8s

clusterRole:
  rules:
    - apiGroups: [""]
      resources: ["nodes/metrics"]
      verbs: ["get"]

presets:
  logsCollection:
    enabled: true
    storeCheckpoints: true
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true

# daemonset mode has no service unless asked - apps need one to push traces
service:
  enabled: true

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs:
          # cadvisor is built into the kubelet, on its authenticated port
          # K8S_NODE_IP is per-pod, so each agent scrapes only its own node
          - job_name: cadvisor
            scheme: https
            metrics_path: /metrics/cadvisor
            scrape_interval: 60s
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            static_configs:
              - targets: ["${env:K8S_NODE_IP}:10250"]
                labels:
                  node: "${env:K8S_NODE_NAME}"
          - job_name: longhorn
            scrape_interval: 60s
            kubernetes_sd_configs:
              - role: pod
                selectors:
                  - role: pod
                    field: spec.nodeName=${env:K8S_NODE_NAME}
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: keep
                regex: longhorn-manager
              # pod also exposes webhook and recovery ports
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: manager
          - job_name: exportarr
            scrape_interval: 180s
            scrape_timeout: 120s
            kubernetes_sd_configs:
              - role: pod
                selectors:
                  - role: pod
                    field: spec.nodeName=${env:K8S_NODE_NAME}
            relabel_configs:
              - source_labels:
                  [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                action: keep
                regex: exportarr
              - source_labels:
                  [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
                target_label: app
          - job_name: annotated-pods
            scrape_interval: 60s
            scrape_timeout: 30s
            kubernetes_sd_configs:
              - role: pod
                selectors:
                  - role: pod
                    field: spec.nodeName=${env:K8S_NODE_NAME}
            relabel_configs:
              - source_labels:
                  [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
              - source_labels:
                  [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                action: drop
                regex: exportarr
              - source_labels:
                  [
                    __address__,
                    __meta_kubernetes_pod_annotation_prometheus_io_port,
                  ]
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $$1:$$2
                target_label: __address__
              - source_labels:
                  [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
                target_label: app
    kubeletstats:
      insecure_skip_verify: true
      # cadvisor covers container and pod, avoid emitting both
      metric_groups: [node, volume]
  exporters:
    debug: null
    otlphttp:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      sending_queue:
        enabled: true
        storage: file_storage
      retry_on_failure:
        enabled: true
    otlphttp/victoriametrics:
      metrics_endpoint: http://victoria-metrics-victoria-metrics-single-server.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
      sending_queue:
        enabled: true
        storage: file_storage
      retry_on_failure:
        enabled: true
    otlphttp/victoriatraces:
      traces_endpoint: http://victoria-traces-vt-single-server.observability.svc.cluster.local:10428/insert/opentelemetry/v1/traces
      sending_queue:
        enabled: true
        storage: file_storage
      retry_on_failure:
        enabled: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/victoriatraces]
      metrics:
        receivers: [kubeletstats, prometheus]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/victoriametrics]
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp]

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

ports:
  otlp:
    enabled: true
    hostPort: null
  otlp-http:
    enabled: true
    hostPort: null
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
