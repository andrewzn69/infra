server:
  retentionPeriod: 90d

  extraArgs:
    # promql and the dashboards need prometheus style names
    opentelemetry.usePrometheusNaming: "true"

  persistentVolume:
    storageClassName: longhorn
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
