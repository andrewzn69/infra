---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: productivity
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:andrewzn69/infra.git
    targetRevision: HEAD
    path: apps/productivity
    directory:
      recurse: true
      include: "**/{application,applicationset}.yaml"
  destination:
    name: vizima
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
