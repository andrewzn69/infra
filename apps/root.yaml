apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:andrewzn69/infra.git
    targetRevision: HEAD
    path: apps
    directory:
      recurse: false
      include: "*.yaml"
  destination:
    name: vizima
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
