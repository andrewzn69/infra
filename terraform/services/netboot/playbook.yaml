- name: install netboot.xyz
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: install dependencies
      ansible.builtin.package:
        name:
          - git
          - ansible
          - tftpd-hpa
        state: present
        update_cache: true

    - name: clone netboot.xyz
      ansible.builtin.git:
        repo: https://github.com/netbootxyz/netboot.xyz.git
        dest: /opt/netboot.xyz
        version: master
        force: true

    - name: run netboot.xyz ansible playbook
      ansible.builtin.command:
        cmd: ansible-playbook -i inventory site.yml
        chdir: /opt/netboot.xyz

    - name: configure tftpd-hpa
      ansible.builtin.copy:
        dest: /etc/default/tftpd-hpa
        content: |
          TFTP_USERNAME="tftp"
          TFTP_DIRECTORY="/var/www/html"
          TFTP_ADDRESS=":69"
          TFTP_OPTIONS="--secure"

    - name: enable and start tftpd-hpa
      ansible.builtin.service:
        name: tftpd-hpa
        enabled: true
        state: restarted
