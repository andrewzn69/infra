- name: install netboot.xyz
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: install dependencies
      ansible.builtin.package:
        name:
          - git
          - ansible
          - tftpd-hpa
          - gcc
          - make
          - perl
          - liblzma-dev
          - mtools
          - xz-utils
        state: present
        update_cache: true

    - name: clone netboot.xyz
      ansible.builtin.git:
        repo: https://github.com/netbootxyz/netboot.xyz.git
        dest: /opt/netboot.xyz
        version: master
        force: true

    - name: configure local boot domain
      ansible.builtin.copy:
        dest: /opt/netboot.xyz/user_overrides.yml
        content: |
          boot_domain: {{ boot_domain }}
          live_endpoint: http://{{ boot_domain }}/cgi-bin/ghproxy

    - name: run netboot.xyz ansible playbook
      ansible.builtin.command:
        cmd: ansible-playbook -i inventory site.yml
        chdir: /opt/netboot.xyz

    - name: configure tftpd-hpa
      ansible.builtin.copy:
        dest: /etc/default/tftpd-hpa
        content: |
          TFTP_USERNAME="tftp"
          TFTP_DIRECTORY="/var/www/html"
          TFTP_ADDRESS=":69"
          TFTP_OPTIONS="--secure"

    - name: enable and start tftpd-hpa
      ansible.builtin.service:
        name: tftpd-hpa
        enabled: true
        state: restarted

    - name: enable apache cgid module
      ansible.builtin.command:
        cmd: a2enmod cgid
      register: cgid_result
      changed_when: "'already enabled' not in cgid_result.stdout"

    - name: create ghproxy cgi script
      ansible.builtin.copy:
        dest: /usr/lib/cgi-bin/ghproxy
        mode: "0755"
        content: |
          #!/bin/bash
          SUFFIX="${REQUEST_URI#/cgi-bin/ghproxy}"
          echo "Content-Type: application/octet-stream"
          echo ""
          exec wget -q -O - "https://github.com/netbootxyz${SUFFIX}"

    - name: restart apache
      ansible.builtin.service:
        name: apache2
        state: restarted

    - name: clone ipxe
      ansible.builtin.git:
        repo: https://github.com/ipxe/ipxe.git
        dest: /opt/ipxe
        version: master
        force: true

    - name: create ipxe boot script
      ansible.builtin.copy:
        dest: /opt/ipxe/src/boot.ipxe
        content: |
          #!ipxe
          dhcp
          chain http://{{ boot_domain }}/menu.ipxe

    - name: build ipxe efi binary
      ansible.builtin.command:
        cmd: make bin-x86_64-efi/snponly.efi EMBED=boot.ipxe TRUST=/etc/ssl/certs/ca-certificates.crt
        chdir: /opt/ipxe/src

    - name: copy ipxe binary to web root
      ansible.builtin.copy:
        src: /opt/ipxe/src/bin-x86_64-efi/snponly.efi
        dest: /var/www/html/ipxe/netboot.xyz-custom.efi
        remote_src: true
